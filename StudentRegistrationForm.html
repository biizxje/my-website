<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>
        <!-- Full Name -->
        <label for="fullName">Full Name:</label><br>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" minlength="3" maxlength="50" required><br><br>

        <!-- Student Code -->
        <label for="studentCode">Student Code:</label><br>
        <input type="text" id="studentCode" name="studentCode" pattern="[A-Za-z0-9]+" required><br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

        <!-- Phone -->
        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10 digit phone number" required><br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- Age -->
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="18" max="30"><br><br>

        <!-- Gender -->
        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <!-- Major -->
        <label for="major">Major:</label><br>
        <select id="major" name="major" required>
            <option value="">-- Select a major --</option>
            <option value="it">Information Technology</option>
            <option value="ai">Artificial Intelligence</option>
            <option value="business">Business Administration</option>
        </select><br><br>

        <!-- Year -->
        <label for="year">Year:</label><br>
        <select id="year" name="year">
            <option value="">-- Select year --</option>
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
        </select><br><br>

        <!-- Hobbies -->
        <p>Hobbies:</p>
        <input type="checkbox" id="sports" name="hobby" value="sports">
        <label for="sports">Sports</label><br>
        <input type="checkbox" id="music" name="hobby" value="music">
        <label for="music">Music</label><br>
        <input type="checkbox" id="reading" name="hobby" value="reading">
        <label for="reading">Reading</label><br><br>

        <!-- Programming Languages -->
        <p>Programming Languages:</p>
        <input type="checkbox" id="html" name="language" value="html">
        <label for="html">HTML/CSS</label><br>
        <input type="checkbox" id="js" name="language" value="javascript">
<label for="js">JavaScript</label><br>
        <input type="checkbox" id="python" name="language" value="python">
        <label for="python">Python</label><br><br>

        <!-- Profile Picture -->
        <label for="photo">Profile Picture:</label><br>
        <input type="file" id="photo" name="photo" accept="image/*"><br><br>

        <!-- Student ID -->
        <label for="studentId">Student ID:</label><br>
        <input type="text" id="studentId" name="studentId" value="SV001" readonly><br><br>

        <!-- Country -->
        <label for="country">Country:</label><br>
        <input type="text" id="country" name="country" value="Vietnam" disabled><br><br>

        <!-- Address -->
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="3" cols="40" placeholder="Enter your address"></textarea><br><br>

        <!-- Introduction -->
        <label for="intro">Introduction:</label><br>
        <textarea id="intro" name="intro" rows="4" cols="40" maxlength="200" placeholder="Introduce yourself (max 200 characters)"></textarea><br><br>

        <!-- Password -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
